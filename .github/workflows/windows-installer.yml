name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[protocols,dev]" pyinstaller

      - name: Run test suite
        run: python -m pytest -q

      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name FreeRov3r --paths src
          --collect-all PySide6 --collect-all can --collect-all serial
          --collect-all isotp --collect-all udsoncan --collect-all cantools
          --add-data "src/freerov3r/assets;freerov3r/assets"
          packaging/launcher.py

      - name: Verify bundled artwork
        run: |
          $assets = @("brand_badge.svg", "brand_banner.svg", "brand_splash.svg")
          foreach ($asset in $assets) {
            $matches = Get-ChildItem -Path "dist/FreeRov3r" -Filter $asset -File -Recurse
            if (-not $matches) { throw "PyInstaller did not bundle required artwork: $asset" }
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\FreeRov3r.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRov3r-Windows-Installer
          path: dist-installer/FreeRov3r-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/FreeRov3r-Setup-*-x64.exe
