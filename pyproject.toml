[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freerov3r"
version = "0.1.0"
description = "Open-source vehicle diagnostics and CAN research platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["python-can>=4.4", "PySide6>=6.7", "pyserial>=3.5"]

[project.optional-dependencies]
protocols = ["can-isotp>=2.0", "udsoncan>=1.23", "cantools>=39"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.entry-points."freerov3r.vehicle_profiles"]
land_rover_l319_lr4 = "freerov3r.vehicle_profiles.l319:L319Profile"

[project.scripts]
freerov3r = "freerov3r.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freerov3r = ["assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
